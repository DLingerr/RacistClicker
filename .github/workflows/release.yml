name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  issues: write

jobs:
  release:
    name: Build and release
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Audit Rust dependencies
        shell: bash
        working-directory: src-tauri
        run: |
          cargo install cargo-audit --locked 2>/dev/null || true
          cargo audit

      - name: Extract changelog
        shell: pwsh
        run: |
          $version = [regex]::Escape(("${{ github.ref_name }}".TrimStart('v')))
          $content = Get-Content CHANGELOG.md -Raw
          $pattern = "(?ms)# v$version .*?(?=\n# v|\z)"
          $match = [regex]::Match($content, $pattern)
          if ($match.Success) {
            Set-Content -Path release_body.md -Value $match.Value.Trim()
          }

      - name: Build
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseBody: See CHANGELOG.md for details.
          releaseDraft: false

      - name: Update release body from changelog
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if (Test-Path release_body.md) {
            gh release edit "${{ github.ref_name }}" --notes-file release_body.md
          }

      - name: Create portable package
        shell: pwsh
        run: |
          & "${{ github.workspace }}/scripts/package-portable.ps1" `
            -RepoRoot "${{ github.workspace }}" `
            -Tag "${{ github.ref_name }}"

      - name: Upload portable package
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" `
            "RacistClicker-${{ github.ref_name }}-portable.zip" `
            --clobber
